name: Published macOS installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Execute the documented public npx command
        run: npx --yes https://github.com/huangjuhua-aigc/WechatConnectAgent/releases/download/v0.2.0/wechat-connect-agent-0.2.0.tgz --non-interactive --no-open
      - name: Verify installed app, extension, links and native contract
        run: |
          APP="$HOME/Applications/ChatInbox.app"
          /usr/bin/codesign --verify --deep --strict "$APP"
          /usr/bin/pluginkit -m -i com.wechatconnectagent.receiver.share
          export CHAT_RECEIVER_EXE="$APP/Contents/MacOS/ChatInbox"
          "$CHAT_RECEIVER_EXE" --identity
          python -m unittest discover -s "$HOME/.agents/skills/wechat-chat-select/scripts" -p 'test_*.py' -v
          test -L "$HOME/.claude/skills/wechat-chat-select"
      - name: Reinstall after Python generated runtime caches
        run: npx --yes https://github.com/huangjuhua-aigc/WechatConnectAgent/releases/download/v0.2.0/wechat-connect-agent-0.2.0.tgz --non-interactive --no-open
